name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Compila
        run: ./gradlew assembleDebug --no-daemon
      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SuperMuto.apk
      - uses: actions/upload-artifact@v5
        with:
          name: SuperMuto-apk
          path: SuperMuto.apk
      - name: Pubblica per il download diretto
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima SuperMuto.apk \
            --title "Super Muto - ultima versione" \
            --notes "Scarica SuperMuto.apk e aprilo sul telefono Android per installarlo." \
            --latest
